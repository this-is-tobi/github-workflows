name: Test Vitest

on:
  workflow_call:
    inputs:
      RUNTIME_VERSION:
        description: Runtime version to use. Defaults to a sensible version per runtime when left empty (Node.js 24, Bun latest)
        type: string
        required: false
        default: ""
      PACKAGE_MANAGER:
        description: Package manager (npm, pnpm, yarn, bun). Empty auto-detects from the packageManager field and lock files
        type: string
        required: false
        default: ""
      RUNTIME:
        description: JavaScript runtime to use (node, bun). Empty auto-detects from lock files
        type: string
        required: false
        default: ""
      WORKING_DIRECTORY:
        description: Working directory for the project
        type: string
        required: false
        default: "."
      TEST_COMMAND:
        description: Custom test command to run (defaults to vitest run)
        type: string
        required: false
        default: ""
      TEST_PRECOMMAND:
        description: Custom command to run before tests (e.g. build)
        type: string
        required: false
        default: ""
      COVERAGE:
        description: Whether to collect test coverage
        type: boolean
        required: false
        default: false
      COVERAGE_REPORTER:
        description: Coverage reporter to use (text, lcov, html, json, etc.)
        type: string
        required: false
        default: "text"
      COVERAGE_ARTIFACT_NAME:
        description: Artifact name of the coverage reports
        required: false
        type: string
        default: unit-tests-coverage
      COVERAGE_ARTIFACT_PATH:
        description: Target path to download coverage artifact
        required: false
        type: string
        default: ./coverage
      FAIL_ON_ERROR:
        description: Whether to fail the workflow on test failures
        type: boolean
        required: false
        default: true
      TIMEOUT:
        description: Test timeout in milliseconds
        type: string
        required: false
        default: "60000"

jobs:
  detect-setup:
    name: Detect project setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package-manager: ${{ steps.detect.outputs.package-manager }}
      runtime: ${{ steps.detect.outputs.runtime }}
      runtime-version: ${{ steps.detect.outputs.runtime-version }}
      has-vitest: ${{ steps.detect.outputs.has-vitest }}
      has-tests: ${{ steps.detect.outputs.has-tests }}
      package-file: ${{ steps.detect.outputs.package-file }}
      test-command: ${{ steps.detect.outputs.test-command }}
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # No step after checkout runs git against the remote, so the job's
        # token has no reason to stay readable in .git/config while installs
        # and caller commands execute.
        persist-credentials: false

    - name: Detect project configuration
      id: detect
      working-directory: ${{ inputs.WORKING_DIRECTORY }}
      env:
        PM_INPUT: ${{ inputs.PACKAGE_MANAGER }}
        RUNTIME_INPUT: ${{ inputs.RUNTIME }}
        VERSION_INPUT: ${{ inputs.RUNTIME_VERSION }}
      run: |
        # Find the package manager by walking from the working directory up
        # to the checkout root - the same resolution npm/pnpm/yarn/bun
        # workspaces (and @antfu/ni) use, so a job scoped to a sub-package
        # still finds the workspace root's lock file or 'packageManager'
        # field. The closest directory with a signal wins.
        detect_pm_at() {
          local dir="$1"
          if [ -f "$dir/package.json" ]; then
            local field
            field=$(jq -r 'if (.packageManager? | type) == "string" then (.packageManager | gsub("^\\s+|\\s+$"; "")) else empty end' "$dir/package.json" 2>/dev/null | cut -d@ -f1 || true)
            if [ -n "$field" ]; then echo "$field"; return 0; fi
          fi
          if [ -f "$dir/bun.lockb" ] || [ -f "$dir/bun.lock" ]; then echo "bun"; return 0; fi
          if [ -f "$dir/pnpm-lock.yaml" ]; then echo "pnpm"; return 0; fi
          if [ -f "$dir/yarn.lock" ]; then echo "yarn"; return 0; fi
          if [ -f "$dir/package-lock.json" ]; then echo "npm"; return 0; fi
          return 1
        }

        walk_pm() {
          local dir root depth found
          dir=$(pwd -P)
          root=$(cd "${GITHUB_WORKSPACE:-/}" 2>/dev/null && pwd -P || echo /)
          depth=0
          while [ "$depth" -lt 30 ]; do
            if found=$(detect_pm_at "$dir"); then
              echo "$found"
              return 0
            fi
            if [ "$dir" = "$root" ] || [ "$dir" = "/" ]; then
              break
            fi
            dir=$(dirname "$dir")
            depth=$((depth + 1))
          done
          echo "npm"
        }

        # Resolve package manager: an explicit input wins, otherwise walk_pm
        if [ -n "$PM_INPUT" ]; then
          DETECTED_PM="$PM_INPUT"
        else
          DETECTED_PM=$(walk_pm)
        fi

        # The detected value can come from the repository's own
        # package.json, so on a pull request this value is attacker-controlled -
        # and it is consumed downstream by shell `case` statements. Pinning it to
        # an allowlist here means those consumers can only ever receive one of
        # four literals, whatever they do with it.
        case "$DETECTED_PM" in
          npm|pnpm|yarn|bun) ;;
          *)
            echo "::error::Unsupported package manager '$DETECTED_PM'. Expected one of npm, pnpm, yarn, bun - check the 'packageManager' field in package.json, or set the PACKAGE_MANAGER input."
            exit 1
            ;;
        esac

        echo "Package manager detected: $DETECTED_PM"
        echo "package-manager=${DETECTED_PM}" >> "$GITHUB_OUTPUT"

        # Detect runtime: explicit input wins, else Bun when the resolved
        # package manager is bun, otherwise Node.js.
        if [ -n "$RUNTIME_INPUT" ]; then
          DETECTED_RUNTIME="$RUNTIME_INPUT"
        elif [ "$DETECTED_PM" = "bun" ]; then
          DETECTED_RUNTIME="bun"
        else
          DETECTED_RUNTIME="node"
        fi
        echo "Runtime detected: $DETECTED_RUNTIME"
        echo "runtime=${DETECTED_RUNTIME}" >> "$GITHUB_OUTPUT"

        # Resolve runtime version: use the explicit input if set, otherwise a
        # per-runtime default (avoids e.g. defaulting Bun to "24", a Node
        # version, when RUNTIME_VERSION is left unset)
        if [ -n "$VERSION_INPUT" ]; then
          RESOLVED_VERSION="$VERSION_INPUT"
        else
          case "$DETECTED_RUNTIME" in
            bun) RESOLVED_VERSION="latest" ;;
            *) RESOLVED_VERSION="24" ;;
          esac
        fi
        echo "Resolved runtime version: $RESOLVED_VERSION"
        echo "runtime-version=${RESOLVED_VERSION}" >> "$GITHUB_OUTPUT"

        # Check for package.json
        if [ -f "package.json" ]; then
          echo "package-file=package.json" >> "$GITHUB_OUTPUT"

          # Check if vitest is in dependencies
          HAS_VITEST="false"
          if grep -q '"vitest"' package.json; then
            HAS_VITEST="true"
          fi
          echo "Vitest found in package.json: $HAS_VITEST"
          echo "has-vitest=${HAS_VITEST}" >> "$GITHUB_OUTPUT"

          # Check for test script in package.json
          if grep -q '"test"' package.json; then
            echo "Test script found in package.json"
            echo "test-command=npm run test" >> "$GITHUB_OUTPUT"
          else
            echo "No test script found in package.json"
            echo "test-command=" >> "$GITHUB_OUTPUT"
          fi
        else
          {
            echo "package-file="
            echo "has-vitest=false"
            echo "test-command="
          } >> "$GITHUB_OUTPUT"
        fi

        # Check for test files.
        #
        # No pipeline, for the reason spelled out at length in test-go.yml's
        # own detection: `... | head -1 | grep -q .` reports no tests for any
        # tree large enough that find is still walking it when head closes the
        # pipe, because find then dies of SIGPIPE and pipefail promotes that to
        # the pipeline's status. The whole suite is skipped, and skipping is a
        # reported success rather than a failure, so nothing says so.
        #
        # A JS project is squarely in the size range where that bites: this
        # walks node_modules unless something stops it, and -quit stops it at
        # the first match rather than after the whole tree.
        #
        # The parentheses are load-bearing. `-o` binds looser than the implicit
        # -a, so without them `-print -quit` would attach to the last -name
        # alone and the other five patterns would print nothing.
        HAS_TESTS="false"
        if [ -n "$(find . \( -name '*.test.js' -o -name '*.test.ts' -o -name '*.test.mjs' \
          -o -name '*.spec.js' -o -name '*.spec.ts' -o -name '*.spec.mjs' \) -print -quit)" ]; then
          HAS_TESTS="true"
        elif [ -d "test" ] || [ -d "tests" ] || [ -d "__tests__" ]; then
          HAS_TESTS="true"
        fi
        echo "Test files found: $HAS_TESTS"
        echo "has-tests=${HAS_TESTS}" >> "$GITHUB_OUTPUT"

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: detect-setup
    permissions:
      contents: read
    if: ${{ needs.detect-setup.outputs.has-tests == 'true' && needs.detect-setup.outputs.has-vitest == 'true' }}
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # No step after checkout runs git against the remote, so the job's
        # token has no reason to stay readable in .git/config while installs
        # and caller commands execute.
        persist-credentials: false

    - name: Setup Node.js
      if: ${{ needs.detect-setup.outputs.runtime == 'node' || needs.detect-setup.outputs.package-manager != 'bun' }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ needs.detect-setup.outputs.runtime == 'node' && needs.detect-setup.outputs.runtime-version || '24' }}

    - name: Setup Bun
      if: ${{ needs.detect-setup.outputs.runtime == 'bun' || needs.detect-setup.outputs.package-manager == 'bun' }}
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ needs.detect-setup.outputs.runtime-version }}

    - name: Setup Corepack
      if: ${{ needs.detect-setup.outputs.package-manager == 'pnpm' || needs.detect-setup.outputs.package-manager == 'yarn' }}
      run: |
        # Exact version: 'latest' would let a new upstream release change
        # what runs here without any change on our side.
        npm install -g corepack@0.34.0
        corepack enable

    - name: Install dependencies (npm)
      if: ${{ needs.detect-setup.outputs.package-manager == 'npm' }}
      working-directory: ${{ inputs.WORKING_DIRECTORY }}
      run: npm ci

    - name: Install dependencies (pnpm)
      if: ${{ needs.detect-setup.outputs.package-manager == 'pnpm' }}
      working-directory: ${{ inputs.WORKING_DIRECTORY }}
      run: pnpm install --frozen-lockfile

    - name: Install dependencies (yarn)
      if: ${{ needs.detect-setup.outputs.package-manager == 'yarn' }}
      working-directory: ${{ inputs.WORKING_DIRECTORY }}
      # Yarn Berry (.yarnrc.yml) uses --immutable; classic uses --frozen-lockfile
      run: |
        if [ -f .yarnrc.yml ]; then
          yarn install --immutable
        else
          yarn install --frozen-lockfile
        fi

    - name: Install dependencies (bun)
      if: ${{ needs.detect-setup.outputs.package-manager == 'bun' }}
      working-directory: ${{ inputs.WORKING_DIRECTORY }}
      run: bun install --frozen-lockfile

    - name: Run tests
      working-directory: ${{ inputs.WORKING_DIRECTORY }}
      env:
        TEST_COMMAND: ${{ inputs.TEST_COMMAND }}
        TEST_PRECOMMAND: ${{ inputs.TEST_PRECOMMAND }}
        DETECTED_TEST_COMMAND: ${{ needs.detect-setup.outputs.test-command }}
        PKG_MANAGER: ${{ needs.detect-setup.outputs.package-manager }}
        COVERAGE: ${{ inputs.COVERAGE }}
        COVERAGE_REPORTER: ${{ inputs.COVERAGE_REPORTER }}
        TIMEOUT: ${{ inputs.TIMEOUT }}
        FAIL_ON_ERROR: ${{ inputs.FAIL_ON_ERROR }}
      run: |
        # Determine test command
        if [ -n "$TEST_COMMAND" ]; then
          TEST_CMD="$TEST_COMMAND"
        elif [ -n "$DETECTED_TEST_COMMAND" ]; then
          case "$PKG_MANAGER" in
            npm)
              TEST_CMD="npm run test"
              ;;
            pnpm)
              TEST_CMD="pnpm test"
              ;;
            yarn)
              TEST_CMD="yarn test"
              ;;
            bun)
              TEST_CMD="bun run test"
              ;;
          esac
        else
          # Use vitest directly
          VITEST_ARGS="run --reporter=verbose"

          # Add coverage if requested
          if [ "$COVERAGE" = "true" ]; then
            VITEST_ARGS="$VITEST_ARGS --coverage --coverage.reporter=$COVERAGE_REPORTER"
          fi

          # Add timeout
          VITEST_ARGS="$VITEST_ARGS --testTimeout=$TIMEOUT"

          case "$PKG_MANAGER" in
            npm)
              TEST_CMD="npx vitest $VITEST_ARGS"
              ;;
            pnpm)
              TEST_CMD="pnpm exec vitest $VITEST_ARGS"
              ;;
            yarn)
              TEST_CMD="yarn vitest $VITEST_ARGS"
              ;;
            bun)
              TEST_CMD="bunx vitest $VITEST_ARGS"
              ;;
          esac
        fi

        # Run pre-command if specified. TEST_PRECOMMAND is a shell command by
        # contract, so it is evaluated - through `eval` from `env:` rather than
        # interpolated into this script, keeping the program text fixed.
        if [ -n "$TEST_PRECOMMAND" ]; then
          echo "Running pre-command: $TEST_PRECOMMAND"
          eval "$TEST_PRECOMMAND"
        fi

        # Run tests and capture exit code
        echo "Running test command: $TEST_CMD"
        EXIT_CODE=0
        $TEST_CMD || EXIT_CODE=$?

        # Handle the exit code based on FAIL_ON_ERROR setting
        if [ $EXIT_CODE -ne 0 ]; then
          if [ "$FAIL_ON_ERROR" = "true" ]; then
            echo "❌ Tests failed and FAIL_ON_ERROR is true. Failing the workflow."
            exit $EXIT_CODE
          else
            echo "⚠️ Tests failed but FAIL_ON_ERROR is false. Workflow will continue."
            echo "Please review and fix the failing tests manually."
          fi
        else
          echo "✅ All tests passed successfully."
        fi

    - name: Upload coverage reports
      if: ${{ inputs.COVERAGE == true && inputs.COVERAGE_REPORTER == 'lcov' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.COVERAGE_ARTIFACT_NAME }}
        path: ${{ inputs.COVERAGE_ARTIFACT_PATH }}

  no-tests:
    name: No tests found
    runs-on: ubuntu-latest
    needs: detect-setup
    permissions: {}
    if: ${{ needs.detect-setup.outputs.has-tests == 'false' }}
    steps:
    - name: Skip tests
      run: |
        echo "ℹ️ No test files found in the project."
        echo "Vitest requires test files to be present to run tests."
        echo "Expected patterns: *.test.{js,ts,mjs}, *.spec.{js,ts,mjs}, or test/tests/__tests__ directories"

  no-vitest:
    name: Vitest not found
    runs-on: ubuntu-latest
    needs: detect-setup
    permissions: {}
    if: ${{ needs.detect-setup.outputs.has-vitest == 'false' }}
    steps:
    - name: Skip tests
      run: |
        echo "ℹ️ Vitest is not listed as a dependency in package.json."
