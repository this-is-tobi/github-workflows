name: ArgoCD preview app

on:
  workflow_call:
    inputs:
      APP_URL_TEMPLATE:
        description: Template for the preview app URL (can include `<pr_number>` placeholder)
        required: true
        type: string
      PR_NUMBER:
        description: ID number of the PR used to deploy Argo-CD preview app
        required: true
        type: number
      ARGOCD_APP_NAME_TEMPLATE:
        description: Template for the Argo-CD application name
        required: true
        type: string
      ARGOCD_SYNC_PAYLOAD_TEMPLATE:
        description: JSON body for the ArgoCD sync API call (can include the `<pr_number>` placeholder)
        required: true
        type: string
      ARGOCD_URL:
        description: URL of the Argo-CD server
        required: true
        type: string
    secrets:
      ARGOCD_TOKEN:
        description: Token used to re-deploy Argo-CD preview app
        required: true

# Every `run:` below is bash. Without this GitHub reads the shell off the runner
# — PowerShell on Windows — so a caller pointing RUNS_ON at one gets a parse
# error where a run should be. `bash` is the portable value: GitHub resolves it
# to Git Bash on Windows and to /usr/bin/bash elsewhere.
defaults:
  run:
    shell: bash

jobs:
  preview-comment:
    name: Add comment with preview infos
    if: ${{ contains(github.event.pull_request.labels.*.name, 'preview') }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
    - name: Generate app url
      id: generate-url
      run: |
        echo "APP_URL=${APP_URL_TEMPLATE//<pr_number>/$PR_NUMBER}" >> "$GITHUB_OUTPUT"
      env:
        APP_URL_TEMPLATE: ${{ inputs.APP_URL_TEMPLATE }}
        PR_NUMBER: ${{ inputs.PR_NUMBER }}

    - name: Comment PR
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        message: |
          🤖 Hey !

          A preview of the application is available at: ${{ steps.generate-url.outputs.APP_URL }}

          *Please be patient, deployment may take a few minutes.*
        header: preview
        # The same PR_NUMBER the preview URL above is built from, so the comment
        # cannot land on a different pull request than the one it advertises.
        number_force: ${{ inputs.PR_NUMBER }}

  preview-sync:
    name: Redeploy preview app
    if: ${{ contains(github.event.pull_request.labels.*.name, 'preview') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Replace template fields
      id: feed-template
      run: |
        echo "ARGOCD_APP_NAME=${ARGOCD_APP_NAME_TEMPLATE//<pr_number>/$PR_NUMBER}" >> "$GITHUB_OUTPUT"
        echo "ARGOCD_SYNC_PAYLOAD=${ARGOCD_SYNC_PAYLOAD_TEMPLATE//<pr_number>/$PR_NUMBER}" >> "$GITHUB_OUTPUT"
      env:
        ARGOCD_APP_NAME_TEMPLATE: ${{ inputs.ARGOCD_APP_NAME_TEMPLATE }}
        ARGOCD_SYNC_PAYLOAD_TEMPLATE: ${{ inputs.ARGOCD_SYNC_PAYLOAD_TEMPLATE }}
        PR_NUMBER: ${{ inputs.PR_NUMBER }}

    - name: Deploy new image
      run: |
        set -e

        # Capture the body via a temp file: a process substitution assignment
        # runs in a subshell, so it would never reach the parent shell here
        RESPONSE_BODY_FILE="$(mktemp)"
        # The Authorization header travels on stdin (-H @-) rather than in
        # curl's argv, where the token would be world-readable in `ps` for the
        # duration of the request.
        RESPONSE_CODE=$(printf 'Authorization: Bearer %s\n' "$ARGOCD_TOKEN" \
          | curl -s -w "%{http_code}" -o "$RESPONSE_BODY_FILE" -X POST "$ARGOCD_URL/api/v1/applications/$ARGOCD_APP_NAME/sync" \
          -H "Content-Type: application/json" \
          -H @- \
          -d "$ARGOCD_SYNC_PAYLOAD")

        echo "HTTP response code: $RESPONSE_CODE"

        if [ "$RESPONSE_CODE" -ne 200 ]; then
          echo "Error: Non-200 HTTP response detected."
          echo "Response body: $(cat "$RESPONSE_BODY_FILE")"
          exit 1
        fi
      env:
        ARGOCD_URL: ${{ inputs.ARGOCD_URL }}
        ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        ARGOCD_APP_NAME: ${{ steps.feed-template.outputs.ARGOCD_APP_NAME }}
        ARGOCD_SYNC_PAYLOAD: ${{ steps.feed-template.outputs.ARGOCD_SYNC_PAYLOAD }}
      continue-on-error: true
