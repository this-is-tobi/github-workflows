name: Sonarqube scan

on:
  workflow_call:
    inputs:
      COVERAGE_IMPORT:
        description: Whether or not to import coverage artifact
        required: false
        type: boolean
        default: false
      COVERAGE_ARTIFACT_NAME:
        description: Artifact name of the coverage reports
        required: false
        type: string
        default: unit-tests-coverage
      COVERAGE_ARTIFACT_PATH:
        description: Target path to download coverage artifact
        required: false
        type: string
        default: ./coverage
      SONAR_EXTRA_ARGS:
        description: Extra arguments to use with Sonarqube
        required: false
        type: string
      SOURCES_PATH:
        description: Paths to the source code that should be analyzed (eg. 'apps,packages')
        required: false
        type: string
      SONAR_URL:
        description: Sonarqube server URL
        required: true
        type: string
      FAIL_ON_ERROR:
        description: Whether to fail the workflow on linting errors
        type: boolean
        required: false
        default: true
      RUNS_ON:
        description: Runner labels as JSON array (e.g., '["ubuntu-24.04"]' or '["self-hosted", "linux"]')
        required: false
        type: string
        default: '["ubuntu-24.04"]'
    secrets:
      SONAR_TOKEN:
        description: Sonarqube token
        required: true
      SONAR_PROJECT_KEY:
        description: Sonarqube project key
        required: true

jobs:
  code-scan:
    name: Run code quality analysis
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
    - name: Checks-out repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0

    - name: Download artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      if: ${{ inputs.COVERAGE_IMPORT }}
      with:
        name: ${{ inputs.COVERAGE_ARTIFACT_NAME }}
        path: ${{ inputs.COVERAGE_ARTIFACT_PATH }}

    - name: Set sonarqube args
      id: sonar-args
      # Refs are passed via env (never inlined into the shell) so a branch name
      # like '$(...)' or backticks can't trigger command substitution here
      env:
        PR_KEY: ${{ github.event.number }}
        PR_BRANCH: ${{ github.head_ref }}
        PR_BASE: ${{ github.base_ref }}
        PR_REPO: ${{ github.repository }}
        BRANCH_NAME: ${{ github.ref_name }}
      run: |
        {
          echo "SONAR_ARGS_PR=-Dsonar.pullrequest.provider=github -Dsonar.pullrequest.key=${PR_KEY} -Dsonar.pullrequest.branch=${PR_BRANCH} -Dsonar.pullrequest.base=${PR_BASE} -Dsonar.pullrequest.github.repository=${PR_REPO}"
          echo "SONAR_ARGS_BRANCH=-Dsonar.branch.name=${BRANCH_NAME}"
        } >> "$GITHUB_OUTPUT"

    - name: SonarQube Scan
      uses: sonarsource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ inputs.SONAR_URL }}
        GITHUB_TOKEN: ${{ github.token }}
      with:
        args: >
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
          -Dsonar.scm.provider=git
          -Dsonar.sources=${{ inputs.SOURCES_PATH}}
          ${{ github.event_name == 'pull_request' && steps.sonar-args.outputs.SONAR_ARGS_PR || steps.sonar-args.outputs.SONAR_ARGS_BRANCH }}
          ${{ inputs.SONAR_EXTRA_ARGS != '' && inputs.SONAR_EXTRA_ARGS || '' }}
      continue-on-error: ${{ inputs.FAIL_ON_ERROR == false }}

    - name: SonarQube Quality Gate check
      id: sonarqube-quality-gate-check
      uses: sonarsource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ inputs.SONAR_URL }}
      timeout-minutes: 5
      continue-on-error: ${{ inputs.FAIL_ON_ERROR == false }}
