name: Lint dependencies

on:
  workflow_call:
    inputs:
      RUNTIME:
        description: JavaScript runtime to use (node, bun). Empty auto-detects from lock files
        type: string
        required: false
        default: ""
      RUNTIME_VERSION:
        description: Runtime version to use. Empty resolves to a per-runtime default (Node.js 24, Bun latest)
        type: string
        required: false
        default: ""
      PACKAGE_MANAGER:
        description: Package manager to use (npm, pnpm, yarn, bun). Empty auto-detects from the packageManager field and lock files
        type: string
        required: false
        default: ""
      WORKING_DIRECTORY:
        description: Working directory for the project
        type: string
        required: false
        default: "."
      INSTALL_COMMAND:
        description: Override install command. Empty uses the package manager's default (npm ci, pnpm/yarn/bun install)
        type: string
        required: false
        default: ""
      PRE_COMMAND:
        description: Command to run before the checks (e.g. a build so publint can inspect dist/types). Skipped if empty
        type: string
        required: false
        default: ""
      KNIP_COMMAND:
        description: Command to run knip (unused files/deps/exports). Skipped if empty
        type: string
        required: false
        default: ""
      PUBLINT_COMMAND:
        description: Command to run publint (package manifest correctness). Skipped if empty
        type: string
        required: false
        default: ""
      FAIL_ON_ERROR:
        description: Whether to fail the workflow when a check reports errors
        type: boolean
        required: false
        default: true

jobs:
  detect-setup:
    name: Detect project setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package-manager: ${{ steps.detect.outputs.package-manager }}
      runtime: ${{ steps.detect.outputs.runtime }}
      runtime-version: ${{ steps.detect.outputs.runtime-version }}
    steps:
    - name: Checks-out repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Detect project configuration
      id: detect
      working-directory: ${{ inputs.WORKING_DIRECTORY }}
      env:
        PM_INPUT: ${{ inputs.PACKAGE_MANAGER }}
        RUNTIME_INPUT: ${{ inputs.RUNTIME }}
        VERSION_INPUT: ${{ inputs.RUNTIME_VERSION }}
      run: |
        set -euo pipefail

        # Find the package manager by walking from the working directory up
        # to the checkout root - the same resolution npm/pnpm/yarn/bun
        # workspaces (and @antfu/ni) use, so a job scoped to a sub-package
        # still finds the workspace root's lock file or 'packageManager'
        # field. The closest directory with a signal wins.
        detect_pm_at() {
          local dir="$1"
          if [ -f "$dir/package.json" ]; then
            local field
            field=$(jq -r '.packageManager // empty' "$dir/package.json" 2>/dev/null | cut -d@ -f1 || true)
            if [ -n "$field" ]; then echo "$field"; return 0; fi
          fi
          if [ -f "$dir/bun.lockb" ] || [ -f "$dir/bun.lock" ]; then echo "bun"; return 0; fi
          if [ -f "$dir/pnpm-lock.yaml" ]; then echo "pnpm"; return 0; fi
          if [ -f "$dir/yarn.lock" ]; then echo "yarn"; return 0; fi
          if [ -f "$dir/package-lock.json" ]; then echo "npm"; return 0; fi
          return 1
        }

        walk_pm() {
          local dir root depth found
          dir=$(pwd -P)
          root=$(cd "${GITHUB_WORKSPACE:-/}" 2>/dev/null && pwd -P || echo /)
          depth=0
          while [ "$depth" -lt 30 ]; do
            if found=$(detect_pm_at "$dir"); then
              echo "$found"
              return 0
            fi
            if [ "$dir" = "$root" ] || [ "$dir" = "/" ]; then
              break
            fi
            dir=$(dirname "$dir")
            depth=$((depth + 1))
          done
          echo "npm"
        }

        # Resolve package manager: an explicit input wins, otherwise walk_pm
        if [ -n "$PM_INPUT" ]; then
          PM="$PM_INPUT"
        else
          PM=$(walk_pm)
        fi
        echo "Package manager: $PM"
        echo "package-manager=${PM}" >> "$GITHUB_OUTPUT"

        # Resolve runtime: explicit input wins, else Bun when the resolved
        # package manager is bun, otherwise Node.js.
        if [ -n "$RUNTIME_INPUT" ]; then
          RUNTIME="$RUNTIME_INPUT"
        elif [ "$PM" = "bun" ]; then
          RUNTIME="bun"
        else
          RUNTIME="node"
        fi
        echo "Runtime: $RUNTIME"
        echo "runtime=${RUNTIME}" >> "$GITHUB_OUTPUT"

        # Resolve runtime version: explicit input wins, else a per-runtime
        # default (avoids defaulting Bun to a Node version).
        if [ -n "$VERSION_INPUT" ]; then
          VERSION="$VERSION_INPUT"
        elif [ "$RUNTIME" = "bun" ]; then
          VERSION="latest"
        else
          VERSION="24"
        fi
        echo "Runtime version: $VERSION"
        echo "runtime-version=${VERSION}" >> "$GITHUB_OUTPUT"

  lint-deps:
    name: Lint dependencies
    runs-on: ubuntu-latest
    needs: detect-setup
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.WORKING_DIRECTORY }}
    steps:
    - name: Checks-out repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup Node.js
      if: ${{ needs.detect-setup.outputs.runtime == 'node' }}
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ needs.detect-setup.outputs.runtime-version }}

    - name: Setup Bun
      if: ${{ needs.detect-setup.outputs.runtime == 'bun' }}
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ needs.detect-setup.outputs.runtime-version }}

    - name: Setup Corepack
      if: ${{ needs.detect-setup.outputs.package-manager == 'pnpm' || needs.detect-setup.outputs.package-manager == 'yarn' }}
      run: |
        npm install -g corepack@latest
        corepack enable

    - name: Install dependencies
      env:
        INSTALL_COMMAND: ${{ inputs.INSTALL_COMMAND }}
        PACKAGE_MANAGER: ${{ needs.detect-setup.outputs.package-manager }}
      run: |
        if [ -n "$INSTALL_COMMAND" ]; then
          eval "$INSTALL_COMMAND"
        else
          case "$PACKAGE_MANAGER" in
            bun)  bun install --frozen-lockfile ;;
            pnpm) pnpm install --frozen-lockfile ;;
            yarn)
              # Yarn Berry (.yarnrc.yml) uses --immutable; classic uses --frozen-lockfile
              if [ -f .yarnrc.yml ]; then
                yarn install --immutable
              else
                yarn install --frozen-lockfile
              fi
              ;;
            *)    npm ci ;;
          esac
        fi

    - name: Pre-command
      if: ${{ inputs.PRE_COMMAND != '' }}
      env:
        PRE_COMMAND: ${{ inputs.PRE_COMMAND }}
      run: eval "$PRE_COMMAND"

    - name: Run knip
      if: ${{ inputs.KNIP_COMMAND != '' }}
      continue-on-error: ${{ !inputs.FAIL_ON_ERROR }}
      env:
        KNIP_COMMAND: ${{ inputs.KNIP_COMMAND }}
      run: eval "$KNIP_COMMAND"

    - name: Run publint
      if: ${{ inputs.PUBLINT_COMMAND != '' }}
      continue-on-error: ${{ !inputs.FAIL_ON_ERROR }}
      env:
        PUBLINT_COMMAND: ${{ inputs.PUBLINT_COMMAND }}
      run: eval "$PUBLINT_COMMAND"
