name: Test Kind

on:
  workflow_call:
    inputs:
      KIND_VERSION:
        description: Kind version to install
        required: false
        type: string
        default: "0.27.0"
      KIND_CONFIG:
        description: Path to Kind cluster configuration file (relative to repo root)
        required: false
        type: string
      KIND_CLUSTER_NAME:
        description: Name of the Kind cluster to create
        required: false
        type: string
        default: chart-testing
      IMAGES:
        description: >-
          Newline-separated container images to pull from registry and load
          into the Kind cluster. GHCR images are authenticated automatically.
        required: false
        type: string
      IMAGE_ARTIFACTS:
        description: >-
          Name or glob pattern of workflow artifact(s) holding image tarballs to load into
          the Kind cluster, instead of pulling them from a registry (e.g. produced by
          'build-docker.yml' with PUSH set to false). Can be combined with IMAGES.
        required: false
        type: string
      IMAGE_ARTIFACTS_FILE:
        description: Name of the tarball file inside each artifact matched by IMAGE_ARTIFACTS
        required: false
        type: string
        default: image.tar
      HELM_PREREQS:
        description: >-
          Newline-separated prerequisite Helm charts to install before the app.
          Format per line: 'namespace release chart [helm_flags...]'.
          Use native Helm flags such as --repo, --values, --set, --version.
        required: false
        type: string
      HELM_CHART:
        description: >-
          Path to the Helm chart directory to deploy. If not set and
          DEPLOY_COMMAND is not set, only cluster creation and image loading
          are performed.
        required: false
        type: string
      HELM_RELEASE:
        description: Helm release name for the application
        required: false
        type: string
        default: "app"
      HELM_VALUES:
        description: Path to Helm values file for the application deployment
        required: false
        type: string
      HELM_ARGS:
        description: Additional arguments passed to 'helm upgrade --install'
        required: false
        type: string
      DEPLOY_COMMAND:
        description: >-
          Custom deploy command to run instead of Helm deploy. Runs after
          image loading and Helm prerequisites. Mutually exclusive with
          HELM_CHART.
        required: false
        type: string
      DEPLOY_TIMEOUT:
        description: Timeout for deployment rollout wait
        required: false
        type: string
        default: "300s"
      PRE_COMMAND:
        description: Shell command to run after checkout but before cluster creation
        required: false
        type: string
      TEST_COMMAND:
        description: Shell command to run after deployment for validation
        required: false
        type: string
      FAIL_ON_ERROR:
        description: Whether to fail the workflow on test command errors
        required: false
        type: boolean
        default: true
      RUNS_ON:
        description: Runner labels as JSON array (e.g., '["ubuntu-24.04"]' or '["self-hosted", "linux"]')
        required: false
        type: string
        default: '["ubuntu-24.04"]'

jobs:
  test-kind:
    name: Test Kind deployment
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    permissions:
      packages: read
      contents: read
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # No step after checkout runs git against the remote, so the job's
        # token has no reason to stay readable in .git/config while installs
        # and caller commands execute.
        persist-credentials: false

    - name: Run pre-command
      if: ${{ inputs.PRE_COMMAND != '' }}
      run: ${{ inputs.PRE_COMMAND }}

    - name: Create Kind cluster
      uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      with:
        version: v${{ inputs.KIND_VERSION }}
        cluster_name: ${{ inputs.KIND_CLUSTER_NAME }}
        config: ${{ inputs.KIND_CONFIG }}
        wait: 120s

    - name: Login to GHCR
      if: ${{ inputs.IMAGES != '' }}
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
        logout: true

    - name: Pull and load images into Kind
      if: ${{ inputs.IMAGES != '' }}
      run: |
        echo "$IMAGES" | while IFS= read -r image; do
          image=$(echo "$image" | xargs)
          [ -z "$image" ] && continue
          echo "Pulling $image..."
          docker pull "$image"
        done

        echo "$IMAGES" | while IFS= read -r image; do
          image=$(echo "$image" | xargs)
          [ -z "$image" ] && continue
          echo "Loading $image into Kind..."
          kind load docker-image --name "$CLUSTER_NAME" "$image"
        done
      env:
        IMAGES: ${{ inputs.IMAGES }}
        CLUSTER_NAME: ${{ inputs.KIND_CLUSTER_NAME }}

    - name: Download image artifacts
      if: ${{ inputs.IMAGE_ARTIFACTS != '' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: ${{ inputs.IMAGE_ARTIFACTS }}
        path: /tmp/kind-images

    - name: Load image archives into Kind
      if: ${{ inputs.IMAGE_ARTIFACTS != '' }}
      run: |
        shopt -s nullglob
        # download-artifact extracts flat when the pattern matches a single artifact,
        # and into one directory per artifact when it matches several
        archives=()
        for candidate in /tmp/kind-images/"$ARCHIVE_FILE" /tmp/kind-images/*/"$ARCHIVE_FILE"; do
          [ -f "$candidate" ] && archives+=("$candidate")
        done

        if [ ${#archives[@]} -eq 0 ]; then
          echo "::error::No image archive named '$ARCHIVE_FILE' was found in the artifacts matching '$IMAGE_ARTIFACTS'."
          exit 1
        fi

        for archive in "${archives[@]}"; do
          echo "Loading $archive into Kind..."
          kind load image-archive --name "$CLUSTER_NAME" "$archive"
        done
      env:
        IMAGE_ARTIFACTS: ${{ inputs.IMAGE_ARTIFACTS }}
        ARCHIVE_FILE: ${{ inputs.IMAGE_ARTIFACTS_FILE }}
        CLUSTER_NAME: ${{ inputs.KIND_CLUSTER_NAME }}

    - name: Install Helm prerequisites
      if: ${{ inputs.HELM_PREREQS != '' }}
      run: |
        echo "$HELM_PREREQS" | while IFS= read -r line; do
          line=$(echo "$line" | xargs)
          [ -z "$line" ] && continue

          read -r namespace release chart extra <<< "$line"
          # `extra` holds any remaining helm flags for this prerequisite, so it
          # is split into separate arguments rather than passed as one string.
          read -ra extra_args <<< "$extra"

          echo "Installing $release ($chart) in namespace $namespace..."
          helm upgrade --install --wait \
            --namespace "$namespace" \
            --create-namespace \
            "${extra_args[@]}" \
            "$release" "$chart"
        done
      env:
        HELM_PREREQS: ${{ inputs.HELM_PREREQS }}

    - name: Deploy application (Helm)
      if: ${{ inputs.HELM_CHART != '' }}
      run: |
        helm dependency build "$HELM_CHART"

        HELM_CMD=(helm upgrade --install --wait)
        if [ -n "$HELM_VALUES" ]; then
          HELM_CMD+=(--values "$HELM_VALUES")
        fi
        # HELM_ARGS is a caller-supplied argv fragment, split once here.
        read -ra HELM_EXTRA_ARGS <<< "$HELM_ARGS"

        "${HELM_CMD[@]}" "${HELM_EXTRA_ARGS[@]}" "$HELM_RELEASE" "$HELM_CHART"
      env:
        HELM_CHART: ${{ inputs.HELM_CHART }}
        HELM_VALUES: ${{ inputs.HELM_VALUES }}
        HELM_ARGS: ${{ inputs.HELM_ARGS }}
        HELM_RELEASE: ${{ inputs.HELM_RELEASE }}

    - name: Deploy application (custom)
      if: ${{ inputs.HELM_CHART == '' && inputs.DEPLOY_COMMAND != '' }}
      run: ${{ inputs.DEPLOY_COMMAND }}

    - name: Wait for rollout
      if: ${{ inputs.HELM_CHART != '' || inputs.DEPLOY_COMMAND != '' }}
      run: |
        for deploy in $(kubectl get deploy -A -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}{"\n"}{end}' 2>/dev/null); do
          ns="${deploy%%/*}"
          name="${deploy##*/}"
          echo "Waiting for $ns/$name..."
          kubectl rollout status "deploy/$name" -n "$ns" -w --timeout="$DEPLOY_TIMEOUT"
        done
      env:
        DEPLOY_TIMEOUT: ${{ inputs.DEPLOY_TIMEOUT }}

    - name: Show cluster status
      if: ${{ inputs.HELM_CHART != '' || inputs.DEPLOY_COMMAND != '' }}
      run: |
        echo "=== Pods ==="
        kubectl get pods -A
        echo ""
        echo "=== Services ==="
        kubectl get svc -A
        echo ""
        echo "=== Deployments ==="
        kubectl get deploy -A

    - name: Run test command
      id: test
      if: ${{ inputs.TEST_COMMAND != '' }}
      # Constant, never an expression. `continue-on-error: ${{ !inputs.FAIL_ON_ERROR }}`
      # silently resolves to true even with FAIL_ON_ERROR set, so the gate never
      # gated. The gating decision is an explicit step at the end of the job.
      continue-on-error: true
      run: ${{ inputs.TEST_COMMAND }}

    - name: Show logs on failure
      # Also keyed on the step outcome: the test step is continue-on-error,
      # so failure() alone no longer fires for it
      if: ${{ failure() || steps.test.outcome == 'failure' }}
      run: |
        echo "=== Failed Pod Logs ==="
        for pod in $(kubectl get pods -A -o jsonpath='{range .items[?(@.status.phase!="Running")]}{.metadata.namespace}/{.metadata.name}{"\n"}{end}' 2>/dev/null); do
          ns="${pod%%/*}"
          name="${pod##*/}"
          echo "--- $ns/$name ---"
          kubectl logs -n "$ns" "$name" --all-containers --tail=50 2>/dev/null || true
        done

    - name: Cleanup Kind cluster
      if: ${{ always() }}
      run: kind delete cluster

    - name: Fail on test errors
      # Runs last so reports, artifacts and cleanup all happen first
      if: ${{ !cancelled() && inputs.FAIL_ON_ERROR && (steps.test.outcome == 'failure') }}
      run: |
        echo "::error::The test command failed."
        exit 1
