name: Test E2E Playwright

on:
  workflow_call:
    inputs:
      BROWSERS:
        description: Comma-separated browsers to test (chrome, firefox, edge, electron)
        required: false
        type: string
        default: "chrome"
      RUNTIME:
        description: JavaScript runtime to use (node or bun). Empty auto-detects from lock files
        required: false
        type: string
        default: ""
      RUNTIME_VERSION:
        description: Runtime version to use. Defaults to a sensible version per runtime when left empty (Node.js 24, Bun latest)
        required: false
        type: string
        default: ""
      PACKAGE_MANAGER:
        description: Package manager (npm, yarn, pnpm, bun). Empty auto-detects from the packageManager field and lock files
        required: false
        type: string
        default: ""
      WORKING_DIRECTORY:
        description: Working directory for running commands
        required: false
        type: string
        default: "."
      PRE_COMMAND:
        description: Shell command to run before tests (e.g., env setup, build)
        required: false
        type: string
      TEST_COMMAND:
        description: >-
          Shell command for running Playwright tests.
          The $BROWSER env var contains the current browser from the matrix.
        required: false
        type: string
        default: "npx playwright test --project=$BROWSER"
      ARTIFACT_PATH:
        description: Path to upload as artifact on failure (e.g., test-results/, screenshots/)
        required: false
        type: string
      ARTIFACT_RETENTION:
        description: Number of days to keep failure artifacts
        required: false
        type: number
        default: 14
      FAIL_ON_ERROR:
        description: Whether to fail the workflow on test errors
        required: false
        type: boolean
        default: true
      RUNS_ON:
        description: Runner labels as JSON array (e.g., '["ubuntu-24.04"]' or '["self-hosted", "linux"]')
        required: false
        type: string
        default: '["ubuntu-24.04"]'

jobs:
  infos:
    name: Get test infos
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    permissions:
      contents: read
    outputs:
      browsers: ${{ steps.matrix.outputs.BROWSERS }}
      package-manager: ${{ steps.detect.outputs.package-manager }}
      runtime: ${{ steps.detect.outputs.runtime }}
      runtime-version: ${{ steps.detect.outputs.runtime-version }}
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # No step after checkout runs git against the remote, so the job's
        # token has no reason to stay readable in .git/config while installs
        # and caller commands execute.
        persist-credentials: false

    - name: Generate browser matrix
      id: matrix
      run: |
        # Trim surrounding whitespace and drop empties so "chrome, firefox"
        # yields ["chrome","firefox"] rather than ["chrome"," firefox"]
        BROWSERS=$(echo "$INPUT_BROWSERS" | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(length > 0))')
        echo "BROWSERS=$BROWSERS" >> "$GITHUB_OUTPUT"
      env:
        INPUT_BROWSERS: ${{ inputs.BROWSERS }}

    - name: Detect project configuration
      id: detect
      working-directory: ${{ inputs.WORKING_DIRECTORY }}
      env:
        PM_INPUT: ${{ inputs.PACKAGE_MANAGER }}
        RUNTIME_INPUT: ${{ inputs.RUNTIME }}
        VERSION_INPUT: ${{ inputs.RUNTIME_VERSION }}
      run: |
        set -euo pipefail

        # Find the package manager by walking from the working directory up
        # to the checkout root - the same resolution npm/pnpm/yarn/bun
        # workspaces (and @antfu/ni) use, so a job scoped to a sub-package
        # still finds the workspace root's lock file or 'packageManager'
        # field. The closest directory with a signal wins.
        detect_pm_at() {
          local dir="$1"
          if [ -f "$dir/package.json" ]; then
            local field
            field=$(jq -r 'if (.packageManager? | type) == "string" then (.packageManager | gsub("^\\s+|\\s+$"; "")) else empty end' "$dir/package.json" 2>/dev/null | cut -d@ -f1 || true)
            if [ -n "$field" ]; then echo "$field"; return 0; fi
          fi
          if [ -f "$dir/bun.lockb" ] || [ -f "$dir/bun.lock" ]; then echo "bun"; return 0; fi
          if [ -f "$dir/pnpm-lock.yaml" ]; then echo "pnpm"; return 0; fi
          if [ -f "$dir/yarn.lock" ]; then echo "yarn"; return 0; fi
          if [ -f "$dir/package-lock.json" ]; then echo "npm"; return 0; fi
          return 1
        }

        walk_pm() {
          local dir root depth found
          dir=$(pwd -P)
          root=$(cd "${GITHUB_WORKSPACE:-/}" 2>/dev/null && pwd -P || echo /)
          depth=0
          while [ "$depth" -lt 30 ]; do
            if found=$(detect_pm_at "$dir"); then
              echo "$found"
              return 0
            fi
            if [ "$dir" = "$root" ] || [ "$dir" = "/" ]; then
              break
            fi
            dir=$(dirname "$dir")
            depth=$((depth + 1))
          done
          echo "npm"
        }

        # Resolve package manager: an explicit input wins, otherwise walk_pm
        if [ -n "$PM_INPUT" ]; then
          PM="$PM_INPUT"
        else
          PM=$(walk_pm)
        fi
        # The detected value can come from the repository's own package.json,
        # so on a pull request it is attacker-controlled - and it selects
        # which commands the steps below run. Pinning it to an allowlist means
        # they can only ever receive one of four literals.
        case "$PM" in
          npm|pnpm|yarn|bun) ;;
          *)
            echo "::error::Unsupported package manager '$PM'. Expected one of npm, pnpm, yarn, bun - check the 'packageManager' field in package.json, or set the PACKAGE_MANAGER input."
            exit 1
            ;;
        esac

        echo "Package manager: $PM"
        echo "package-manager=${PM}" >> "$GITHUB_OUTPUT"

        # Resolve runtime: explicit input wins, else Bun when the resolved
        # package manager is bun, otherwise Node.js.
        if [ -n "$RUNTIME_INPUT" ]; then RUNTIME="$RUNTIME_INPUT"
        elif [ "$PM" = "bun" ]; then RUNTIME="bun"
        else RUNTIME="node"; fi
        echo "Runtime: $RUNTIME"
        echo "runtime=${RUNTIME}" >> "$GITHUB_OUTPUT"

        # Resolve runtime version: explicit input wins, else a per-runtime
        # default (avoids defaulting Bun to a Node version).
        if [ -n "$VERSION_INPUT" ]; then VERSION="$VERSION_INPUT"
        elif [ "$RUNTIME" = "bun" ]; then VERSION="latest"
        else VERSION="24"; fi
        echo "Runtime version: $VERSION"
        echo "runtime-version=${VERSION}" >> "$GITHUB_OUTPUT"

  e2e-tests:
    name: E2E tests (${{ matrix.browser }})
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    permissions:
      contents: read
    needs:
    - infos
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.infos.outputs.browsers) }}
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # No step after checkout runs git against the remote, so the job's
        # token has no reason to stay readable in .git/config while installs
        # and caller commands execute.
        persist-credentials: false

    - name: Setup Node.js
      if: ${{ needs.infos.outputs.runtime == 'node' || needs.infos.outputs.package-manager != 'bun' }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ needs.infos.outputs.runtime == 'node' && needs.infos.outputs.runtime-version || '24' }}

    - name: Setup Corepack
      if: ${{ needs.infos.outputs.package-manager == 'pnpm' || needs.infos.outputs.package-manager == 'yarn' }}
      run: |
        # Exact version: 'latest' would let a new upstream release change
        # what runs here without any change on our side.
        npm install -g corepack@0.34.0
        corepack enable

    - name: Setup Bun
      if: ${{ needs.infos.outputs.runtime == 'bun' || needs.infos.outputs.package-manager == 'bun' }}
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ needs.infos.outputs.runtime-version }}

    - name: Setup Firefox
      if: ${{ matrix.browser == 'firefox' }}
      uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2

    - name: Setup Chrome
      if: ${{ matrix.browser == 'chrome' }}
      uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2

    - name: Setup Edge
      if: ${{ matrix.browser == 'edge' }}
      uses: browser-actions/setup-edge@e2f31d5d9f2e6d75e72516221b4df8528e6325cf # v1.1.2

    - name: Get cache directory
      id: cache-dir
      working-directory: ${{ inputs.WORKING_DIRECTORY }}
      run: |
        case "$PKG_MANAGER" in
          npm)  echo "CACHE_DIR=$(npm config get cache)" >> "$GITHUB_OUTPUT" ;;
          yarn) echo "CACHE_DIR=$(yarn cache dir)" >> "$GITHUB_OUTPUT" ;;
          pnpm) echo "CACHE_DIR=$(pnpm store path)" >> "$GITHUB_OUTPUT" ;;
          bun)  echo "CACHE_DIR=$(bun pm cache)" >> "$GITHUB_OUTPUT" ;;
        esac
      env:
        PKG_MANAGER: ${{ needs.infos.outputs.package-manager }}

    - name: Cache dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.cache-dir.outputs.CACHE_DIR }}
        key: ${{ needs.infos.outputs.package-manager }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml', '**/bun.lock') }}
        restore-keys: |
          ${{ needs.infos.outputs.package-manager }}-${{ runner.os }}-${{ runner.arch }}-

    - name: Install dependencies
      working-directory: ${{ inputs.WORKING_DIRECTORY }}
      # Yarn Berry (.yarnrc.yml) uses --immutable; classic uses --frozen-lockfile
      run: |
        case "$PKG_MANAGER" in
          npm)  npm ci ;;
          yarn)
            if [ -f .yarnrc.yml ]; then yarn install --immutable; else yarn install --frozen-lockfile; fi ;;
          pnpm) pnpm install --frozen-lockfile ;;
          bun)  bun install --frozen-lockfile ;;
        esac
      env:
        PKG_MANAGER: ${{ needs.infos.outputs.package-manager }}

    - name: Run pre-command
      if: ${{ inputs.PRE_COMMAND != '' }}
      working-directory: ${{ inputs.WORKING_DIRECTORY }}
      run: ${{ inputs.PRE_COMMAND }}

    - name: Run Playwright tests
      id: playwright-run
      # Constant, never an expression. `continue-on-error: ${{ !inputs.FAIL_ON_ERROR }}`
      # silently resolves to true even with FAIL_ON_ERROR set, so the gate never
      # gated. The gating decision is an explicit step at the end of the job.
      continue-on-error: true
      working-directory: ${{ inputs.WORKING_DIRECTORY }}
      run: ${{ inputs.TEST_COMMAND }}
      env:
        BROWSER: ${{ matrix.browser }}

    - name: Upload test artifacts
      if: ${{ always() && steps.playwright-run.outcome == 'failure' && inputs.ARTIFACT_PATH != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: playwright-report-${{ matrix.browser }}
        path: ${{ inputs.ARTIFACT_PATH }}
        retention-days: ${{ inputs.ARTIFACT_RETENTION }}

    - name: Fail on test errors
      # Runs last so reports, artifacts and cleanup all happen first
      if: ${{ !cancelled() && inputs.FAIL_ON_ERROR && (steps.playwright-run.outcome == 'failure') }}
      run: |
        echo "::error::Playwright tests failed."
        exit 1
