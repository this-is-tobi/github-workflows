name: Test E2E Playwright

on:
  workflow_call:
    inputs:
      BROWSERS:
        description: Comma-separated browsers to test (chrome, firefox, edge, electron)
        required: false
        type: string
        default: "chrome"
      RUNTIME:
        description: JavaScript runtime to use (node or bun). Empty auto-detects from lock files
        required: false
        type: string
        default: ""
      RUNTIME_VERSION:
        description: Runtime version to use. Defaults to a sensible version per runtime when left empty (Node.js 24, Bun latest)
        required: false
        type: string
        default: ""
      PACKAGE_MANAGER:
        description: Package manager (npm, yarn, pnpm, bun). Empty auto-detects from the packageManager field and lock files
        required: false
        type: string
        default: ""
      WORKING_DIRECTORY:
        description: Working directory for running commands
        required: false
        type: string
        default: "."
      PRE_COMMAND:
        description: Shell command to run before tests (e.g., env setup, build)
        required: false
        type: string
      TEST_COMMAND:
        description: >-
          Shell command for running Playwright tests.
          The $BROWSER env var contains the current browser from the matrix.
        required: false
        type: string
        default: "npx playwright test --project=$BROWSER"
      ARTIFACT_PATH:
        description: Path to upload as artifact on failure (e.g., test-results/, screenshots/)
        required: false
        type: string
      ARTIFACT_RETENTION:
        description: Number of days to keep failure artifacts
        required: false
        type: number
        default: 14
      FAIL_ON_ERROR:
        description: Whether to fail the workflow on test errors
        required: false
        type: boolean
        default: true
      RUNS_ON:
        description: Runner labels as JSON array (e.g., '["ubuntu-24.04"]' or '["self-hosted", "linux"]')
        required: false
        type: string
        default: '["ubuntu-24.04"]'

jobs:
  infos:
    name: Get test infos
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    permissions:
      contents: read
    outputs:
      browsers: ${{ steps.matrix.outputs.BROWSERS }}
      package-manager: ${{ steps.detect.outputs.package-manager }}
      runtime: ${{ steps.detect.outputs.runtime }}
      runtime-version: ${{ steps.detect.outputs.runtime-version }}
    steps:
    - name: Checks-out repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Generate browser matrix
      id: matrix
      run: |
        # Trim surrounding whitespace and drop empties so "chrome, firefox"
        # yields ["chrome","firefox"] rather than ["chrome"," firefox"]
        BROWSERS=$(echo "$INPUT_BROWSERS" | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(length > 0))')
        echo "BROWSERS=$BROWSERS" >> "$GITHUB_OUTPUT"
      env:
        INPUT_BROWSERS: ${{ inputs.BROWSERS }}

    - name: Detect project configuration
      id: detect
      working-directory: ${{ inputs.WORKING_DIRECTORY }}
      env:
        PM_INPUT: ${{ inputs.PACKAGE_MANAGER }}
        RUNTIME_INPUT: ${{ inputs.RUNTIME }}
        VERSION_INPUT: ${{ inputs.RUNTIME_VERSION }}
      run: |
        set -euo pipefail
        has_bun_lock() { [ -f bun.lockb ] || [ -f bun.lock ]; }

        # Detect package manager. Precedence mirrors @antfu/ni: an explicit
        # input wins, then the corepack 'packageManager' field in package.json,
        # then lock files, and finally npm as a last resort.
        if [ -n "$PM_INPUT" ]; then
          PM="$PM_INPUT"
        else
          PM_FIELD=""
          if [ -f package.json ]; then
            PM_FIELD=$(jq -r '.packageManager // empty' package.json 2>/dev/null | cut -d@ -f1 || true)
          fi
          if [ -n "$PM_FIELD" ]; then PM="$PM_FIELD"
          elif has_bun_lock; then PM="bun"
          elif [ -f pnpm-lock.yaml ]; then PM="pnpm"
          elif [ -f yarn.lock ]; then PM="yarn"
          else PM="npm"; fi
        fi
        echo "Package manager: $PM"
        echo "package-manager=${PM}" >> "$GITHUB_OUTPUT"

        # Detect runtime: explicit input wins, else Bun when the package
        # manager or a lock file says so, otherwise Node.js.
        if [ -n "$RUNTIME_INPUT" ]; then RUNTIME="$RUNTIME_INPUT"
        elif [ "$PM" = "bun" ] || has_bun_lock; then RUNTIME="bun"
        else RUNTIME="node"; fi
        echo "Runtime: $RUNTIME"
        echo "runtime=${RUNTIME}" >> "$GITHUB_OUTPUT"

        # Resolve runtime version: explicit input wins, else a per-runtime
        # default (avoids defaulting Bun to a Node version).
        if [ -n "$VERSION_INPUT" ]; then VERSION="$VERSION_INPUT"
        elif [ "$RUNTIME" = "bun" ]; then VERSION="latest"
        else VERSION="24"; fi
        echo "Runtime version: $VERSION"
        echo "runtime-version=${VERSION}" >> "$GITHUB_OUTPUT"

  e2e-tests:
    name: E2E tests (${{ matrix.browser }})
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    permissions:
      contents: read
    needs:
    - infos
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.infos.outputs.browsers) }}
    steps:
    - name: Checks-out repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup Node.js
      if: ${{ needs.infos.outputs.runtime == 'node' || needs.infos.outputs.package-manager != 'bun' }}
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ needs.infos.outputs.runtime == 'node' && needs.infos.outputs.runtime-version || '24' }}

    - name: Setup Corepack
      if: ${{ needs.infos.outputs.package-manager == 'pnpm' || needs.infos.outputs.package-manager == 'yarn' }}
      run: |
        npm install -g corepack@latest
        corepack enable

    - name: Setup Bun
      if: ${{ needs.infos.outputs.runtime == 'bun' || needs.infos.outputs.package-manager == 'bun' }}
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ needs.infos.outputs.runtime-version }}

    - name: Setup Firefox
      if: ${{ matrix.browser == 'firefox' }}
      uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2

    - name: Setup Chrome
      if: ${{ matrix.browser == 'chrome' }}
      uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2

    - name: Setup Edge
      if: ${{ matrix.browser == 'edge' }}
      uses: browser-actions/setup-edge@e2f31d5d9f2e6d75e72516221b4df8528e6325cf # v1.1.2

    - name: Get cache directory
      id: cache-dir
      working-directory: ${{ inputs.WORKING_DIRECTORY }}
      run: |
        case "$PKG_MANAGER" in
          npm)  echo "CACHE_DIR=$(npm config get cache)" >> $GITHUB_OUTPUT ;;
          yarn) echo "CACHE_DIR=$(yarn cache dir)" >> $GITHUB_OUTPUT ;;
          pnpm) echo "CACHE_DIR=$(pnpm store path)" >> $GITHUB_OUTPUT ;;
          bun)  echo "CACHE_DIR=$(bun pm cache)" >> $GITHUB_OUTPUT ;;
        esac
      env:
        PKG_MANAGER: ${{ needs.infos.outputs.package-manager }}

    - name: Cache dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.cache-dir.outputs.CACHE_DIR }}
        key: ${{ needs.infos.outputs.package-manager }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml', '**/bun.lock') }}
        restore-keys: |
          ${{ needs.infos.outputs.package-manager }}-${{ runner.os }}-${{ runner.arch }}-

    - name: Install dependencies
      working-directory: ${{ inputs.WORKING_DIRECTORY }}
      # Yarn Berry (.yarnrc.yml) uses --immutable; classic uses --frozen-lockfile
      run: |
        case "$PKG_MANAGER" in
          npm)  npm ci ;;
          yarn)
            if [ -f .yarnrc.yml ]; then yarn install --immutable; else yarn install --frozen-lockfile; fi ;;
          pnpm) pnpm install --frozen-lockfile ;;
          bun)  bun install --frozen-lockfile ;;
        esac
      env:
        PKG_MANAGER: ${{ needs.infos.outputs.package-manager }}

    - name: Run pre-command
      if: ${{ inputs.PRE_COMMAND != '' }}
      working-directory: ${{ inputs.WORKING_DIRECTORY }}
      run: ${{ inputs.PRE_COMMAND }}

    - name: Run Playwright tests
      id: playwright-run
      continue-on-error: ${{ !inputs.FAIL_ON_ERROR }}
      working-directory: ${{ inputs.WORKING_DIRECTORY }}
      run: ${{ inputs.TEST_COMMAND }}
      env:
        BROWSER: ${{ matrix.browser }}

    - name: Upload test artifacts
      if: ${{ always() && steps.playwright-run.outcome == 'failure' && inputs.ARTIFACT_PATH != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: playwright-report-${{ matrix.browser }}
        path: ${{ inputs.ARTIFACT_PATH }}
        retention-days: ${{ inputs.ARTIFACT_RETENTION }}
