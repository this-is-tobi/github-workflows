name: Lint JavaScript files

on:
  workflow_call:
    inputs:
      RUNTIME_VERSION:
        description: Runtime version to use. Defaults to a sensible version per runtime when left empty (Node.js 24, Bun latest)
        type: string
        required: false
        default: ""
      PACKAGE_MANAGER:
        description: Package manager (npm, pnpm, yarn, bun). Empty auto-detects from the packageManager field and lock files
        type: string
        required: false
        default: ""
      RUNTIME:
        description: JavaScript runtime to use (node, bun). Empty auto-detects from lock files
        type: string
        required: false
        default: ""
      ESLINT_CONFIG:
        description: ESLint config package to use (defaults to @antfu/eslint-config)
        type: string
        required: false
        default: "@antfu/eslint-config"
      WORKING_DIRECTORY:
        description: Working directory for the project
        type: string
        required: false
        default: "."
      LINT_PATHS:
        description: Paths to lint (space or comma-separated)
        type: string
        required: false
        default: "."
      ESLINT_CONFIG_FILE:
        description: Path to custom ESLint config file (if exists, will skip auto-config)
        type: string
        required: false
        default: ""
      FAIL_ON_ERROR:
        description: Whether to fail the workflow on linting errors
        type: boolean
        required: false
        default: true

jobs:
  detect-setup:
    name: Detect project setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package-manager: ${{ steps.detect.outputs.package-manager }}
      runtime: ${{ steps.detect.outputs.runtime }}
      runtime-version: ${{ steps.detect.outputs.runtime-version }}
      has-eslint-config: ${{ steps.detect.outputs.has-eslint-config }}
      package-file: ${{ steps.detect.outputs.package-file }}
    steps:
    - name: Checks-out repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Detect project configuration
      id: detect
      working-directory: ${{ inputs.WORKING_DIRECTORY }}
      env:
        PM_INPUT: ${{ inputs.PACKAGE_MANAGER }}
        RUNTIME_INPUT: ${{ inputs.RUNTIME }}
        VERSION_INPUT: ${{ inputs.RUNTIME_VERSION }}
      run: |
        # Find the package manager by walking from the working directory up
        # to the checkout root - the same resolution npm/pnpm/yarn/bun
        # workspaces (and @antfu/ni) use, so a job scoped to a sub-package
        # still finds the workspace root's lock file or 'packageManager'
        # field. The closest directory with a signal wins.
        detect_pm_at() {
          local dir="$1"
          if [ -f "$dir/package.json" ]; then
            local field
            field=$(jq -r 'if (.packageManager? | type) == "string" then (.packageManager | gsub("^\\s+|\\s+$"; "")) else empty end' "$dir/package.json" 2>/dev/null | cut -d@ -f1 || true)
            if [ -n "$field" ]; then echo "$field"; return 0; fi
          fi
          if [ -f "$dir/bun.lockb" ] || [ -f "$dir/bun.lock" ]; then echo "bun"; return 0; fi
          if [ -f "$dir/pnpm-lock.yaml" ]; then echo "pnpm"; return 0; fi
          if [ -f "$dir/yarn.lock" ]; then echo "yarn"; return 0; fi
          if [ -f "$dir/package-lock.json" ]; then echo "npm"; return 0; fi
          return 1
        }

        walk_pm() {
          local dir root depth found
          dir=$(pwd -P)
          root=$(cd "${GITHUB_WORKSPACE:-/}" 2>/dev/null && pwd -P || echo /)
          depth=0
          while [ "$depth" -lt 30 ]; do
            if found=$(detect_pm_at "$dir"); then
              echo "$found"
              return 0
            fi
            if [ "$dir" = "$root" ] || [ "$dir" = "/" ]; then
              break
            fi
            dir=$(dirname "$dir")
            depth=$((depth + 1))
          done
          echo "npm"
        }

        # Resolve package manager: an explicit input wins, otherwise walk_pm
        if [ -n "$PM_INPUT" ]; then
          DETECTED_PM="$PM_INPUT"
        else
          DETECTED_PM=$(walk_pm)
        fi
        echo "Package manager detected: $DETECTED_PM"
        echo "package-manager=${DETECTED_PM}" >> "$GITHUB_OUTPUT"

        # Detect runtime: explicit input wins, else Bun when the resolved
        # package manager is bun, otherwise Node.js.
        if [ -n "$RUNTIME_INPUT" ]; then
          DETECTED_RUNTIME="$RUNTIME_INPUT"
        elif [ "$DETECTED_PM" = "bun" ]; then
          DETECTED_RUNTIME="bun"
        else
          DETECTED_RUNTIME="node"
        fi
        echo "Runtime detected: $DETECTED_RUNTIME"
        echo "runtime=${DETECTED_RUNTIME}" >> "$GITHUB_OUTPUT"

        # Resolve runtime version: use the explicit input if set, otherwise a
        # per-runtime default (avoids e.g. defaulting Bun to "24", a Node
        # version, when RUNTIME_VERSION is left unset)
        if [ -n "$VERSION_INPUT" ]; then
          RESOLVED_VERSION="$VERSION_INPUT"
        else
          case "$DETECTED_RUNTIME" in
            bun) RESOLVED_VERSION="latest" ;;
            *) RESOLVED_VERSION="24" ;;
          esac
        fi
        echo "Resolved runtime version: $RESOLVED_VERSION"
        echo "runtime-version=${RESOLVED_VERSION}" >> $GITHUB_OUTPUT

        # Check for existing ESLint config
        HAS_CONFIG="false"
        if [ -n "${{ inputs.ESLINT_CONFIG_FILE }}" ] && [ -f "${{ inputs.ESLINT_CONFIG_FILE }}" ]; then
          HAS_CONFIG="true"
        elif [ -f "eslint.config.js" ] || [ -f "eslint.config.mjs" ] || [ -f "eslint.config.cjs" ] || [ -f ".eslintrc.js" ] || [ -f ".eslintrc.json" ] || [ -f ".eslintrc.yml" ] || [ -f ".eslintrc.yaml" ]; then
          HAS_CONFIG="true"
        fi
        echo "ESLint config exists: $HAS_CONFIG"
        echo "has-eslint-config=${HAS_CONFIG}" >> $GITHUB_OUTPUT

        # Detect package file
        if [ -f "package.json" ]; then
          echo "package-file=package.json" >> $GITHUB_OUTPUT
        else
          echo "package-file=" >> $GITHUB_OUTPUT
        fi

  lint:
    name: Lint files
    runs-on: ubuntu-latest
    needs: detect-setup
    permissions:
      contents: read
    steps:
    - name: Checks-out repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup Node.js
      if: ${{ needs.detect-setup.outputs.runtime == 'node' || needs.detect-setup.outputs.package-manager != 'bun' }}
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ needs.detect-setup.outputs.runtime == 'node' && needs.detect-setup.outputs.runtime-version || '24' }}

    - name: Setup Bun
      if: ${{ needs.detect-setup.outputs.runtime == 'bun' || needs.detect-setup.outputs.package-manager == 'bun' }}
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ needs.detect-setup.outputs.runtime-version }}

    - name: Setup Corepack
      if: ${{ needs.detect-setup.outputs.package-manager == 'pnpm' || needs.detect-setup.outputs.package-manager == 'yarn' }}
      run: |
        npm install -g corepack@latest
        corepack enable

    - name: Install dependencies (npm)
      if: ${{ needs.detect-setup.outputs.package-manager == 'npm' }}
      working-directory: ${{ inputs.WORKING_DIRECTORY }}
      run: npm ci

    - name: Install dependencies (pnpm)
      if: ${{ needs.detect-setup.outputs.package-manager == 'pnpm' }}
      working-directory: ${{ inputs.WORKING_DIRECTORY }}
      run: pnpm install --frozen-lockfile

    - name: Install dependencies (yarn)
      if: ${{ needs.detect-setup.outputs.package-manager == 'yarn' }}
      working-directory: ${{ inputs.WORKING_DIRECTORY }}
      # Yarn Berry (.yarnrc.yml) uses --immutable; classic uses --frozen-lockfile
      run: |
        if [ -f .yarnrc.yml ]; then
          yarn install --immutable
        else
          yarn install --frozen-lockfile
        fi

    - name: Install dependencies (bun)
      if: ${{ needs.detect-setup.outputs.package-manager == 'bun' }}
      working-directory: ${{ inputs.WORKING_DIRECTORY }}
      run: bun install --frozen-lockfile

    - name: Setup ESLint config (if not exists)
      if: ${{ needs.detect-setup.outputs.has-eslint-config == 'false' }}
      working-directory: ${{ inputs.WORKING_DIRECTORY }}
      run: |
        # Check if ESLint is already in package.json
        echo "Checking for ESLint in package file: ${{ needs.detect-setup.outputs.package-file }}"
        if ! grep -q '"eslint"' ${{ needs.detect-setup.outputs.package-file }} 2>/dev/null; then
          # Install ESLint and config
          echo "Installing ESLint and config: ${{ inputs.ESLINT_CONFIG }}"
          case "${{ needs.detect-setup.outputs.package-manager }}" in
            npm)
              npm install --save-dev eslint ${{ inputs.ESLINT_CONFIG }}
              ;;
            pnpm)
              pnpm add -D eslint ${{ inputs.ESLINT_CONFIG }}
              ;;
            yarn)
              yarn add -D eslint ${{ inputs.ESLINT_CONFIG }}
              ;;
            bun)
              bun add -d eslint ${{ inputs.ESLINT_CONFIG }}
              ;;
          esac
        fi

        # Create ESLint config if it doesn't exist
        echo "Creating ESLint config file: eslint.config.js"
        cat > eslint.config.js << 'EOF'
        import antfu from '${{ inputs.ESLINT_CONFIG }}'

        export default antfu({
          vue: true,
          typescript: true,
          formatters: false,
          ignores: [
            '**/node_modules',
            '**/dist',
            '**/build',
            '**/.turbo',
            '**/coverage',
            '**/.nuxt',
            '**/.output',
            'pnpm-lock.yaml',
          ],
          stylistic: {
            overrides: {
              'antfu/if-newline': 'off',
              'jsonc/sort-keys': 'off',
              'no-console': 'off',
              'node/prefer-global/process': ['error', 'always'],
              'node/prefer-global/console': ['error', 'always'],
              'node/prefer-global/buffer': ['error', 'always'],
              'style/comma-dangle': ['error', 'always-multiline'],
              'style/quote-props': ['error', 'as-needed', { keywords: false, unnecessary: true }],
              'style/brace-style': ['error', '1tbs', { allowSingleLine: true }],
              'style/max-statements-per-line': ['error', { max: 2 }],
              'ts/ban-ts-comment': 'off',
              'unused-imports/no-unused-imports': 'error',
              'unused-imports/no-unused-vars': ['error', { vars: 'all', varsIgnorePattern: '^_', args: 'after-used', argsIgnorePattern: '^_', caughtErrors: 'all', caughtErrorsIgnorePattern: '^_', destructuredArrayIgnorePattern: '^_' }],
              'vue/no-v-html': 'off',
              'vue/no-irregular-whitespace': 'off',
              'vue/script-indent': 'off',
            },
          },
          yaml: {
            overrides: {
              'yaml/quotes': ['error', { prefer: 'double' }],
              'yaml/indent': ['error', 2, { indentBlockSequences: false }],
            },
          },
        })
        EOF

    - name: Run ESLint
      working-directory: ${{ inputs.WORKING_DIRECTORY }}
      env:
        ESLINT_CONFIG_FILE: ${{ inputs.ESLINT_CONFIG_FILE }}
        LINT_PATHS: ${{ inputs.LINT_PATHS }}
      run: |
        CONFIG_FLAG=""
        # Match the detection step: only use --config when the file actually exists
        if [ -n "$ESLINT_CONFIG_FILE" ] && [ -f "$ESLINT_CONFIG_FILE" ]; then
          CONFIG_FLAG="--config $ESLINT_CONFIG_FILE"
        fi

        # Accept comma- or space-separated paths (shell word-splitting only
        # handles whitespace, so normalize commas to spaces first)
        LINT_PATHS="${LINT_PATHS//,/ }"

        # Run ESLint and capture exit code
        EXIT_CODE=0
        case "${{ needs.detect-setup.outputs.package-manager }}" in
          npm)
            npx eslint $CONFIG_FLAG $LINT_PATHS || EXIT_CODE=$?
            ;;
          pnpm)
            pnpm exec eslint $CONFIG_FLAG $LINT_PATHS || EXIT_CODE=$?
            ;;
          yarn)
            yarn eslint $CONFIG_FLAG $LINT_PATHS || EXIT_CODE=$?
            ;;
          bun)
            bunx eslint $CONFIG_FLAG $LINT_PATHS || EXIT_CODE=$?
            ;;
        esac

        # Handle the exit code based on FAIL_ON_ERROR setting
        if [ $EXIT_CODE -ne 0 ]; then
          if [ "${{ inputs.FAIL_ON_ERROR }}" = "true" ]; then
            echo "❌ ESLint found errors and FAIL_ON_ERROR is true. Failing the workflow."
            exit $EXIT_CODE
          else
            echo "⚠️ ESLint found errors but FAIL_ON_ERROR is false. Workflow will continue."
            echo "Please review and fix the linting errors manually."
          fi
        else
          echo "✅ ESLint completed successfully with no errors."
        fi
