name: Attest image

on:
  workflow_call:
    inputs:
      IMAGE_NAME:
        description: Full image name including registry and path (e.g. 'ghcr.io/my-org/my-image'). Normalized automatically (lowercase, underscores replaced by dashes).
        required: true
        type: string
      DIGEST:
        description: Digest of the image to attest (e.g. 'sha256:abc123...'). Use the 'digest' output of build-docker.yml.
        required: true
        type: string
      PROVENANCE:
        description: Generate SLSA provenance attestation for the image
        required: false
        default: false
        type: boolean
      SBOM:
        description: Generate SBOM attestation for the image
        required: false
        default: false
        type: boolean
      SIGN:
        description: Sign the image digest with cosign keyless signing
        required: false
        default: false
        type: boolean
      PROVENANCE_PREDICATE_TYPE:
        description: >-
          URI identifying a custom provenance predicate type. When set together with
          PROVENANCE_PREDICATE, replaces the default auto-generated SLSA build
          provenance. Ignored if PROVENANCE is false.
        required: false
        type: string
      PROVENANCE_PREDICATE:
        description: >-
          JSON content for a custom provenance predicate. When set together with
          PROVENANCE_PREDICATE_TYPE, replaces the default auto-generated SLSA build
          provenance. Ignored if PROVENANCE is false.
        required: false
        type: string
      RUNS_ON:
        description: Runner labels as JSON array (e.g., '["ubuntu-24.04"]' or '["self-hosted", "linux"]')
        required: false
        type: string
        default: '["ubuntu-24.04"]'
    secrets:
      REGISTRY_USERNAME:
        description: Username used to login into registry (not needed for ghcr.io)
        required: false
      REGISTRY_PASSWORD:
        description: Password used to login into registry (not needed for ghcr.io)
        required: false

jobs:
  attest:
    name: Attest image
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    permissions:
      packages: write
      id-token: write
      attestations: write
    steps:
    - name: Normalize image name
      id: normalize
      env:
        INPUT_IMAGE_NAME: ${{ inputs.IMAGE_NAME }}
      run: |
        NORMALIZED_IMAGE=$(echo "$INPUT_IMAGE_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/_/-/g')
        echo "NORMALIZED_IMAGE=$NORMALIZED_IMAGE" >> $GITHUB_OUTPUT
        echo "REGISTRY=$(echo "$INPUT_IMAGE_NAME" | cut -d "/" -f 1 | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Login to registry
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
      with:
        registry: ${{ steps.normalize.outputs.REGISTRY }}
        username: ${{ steps.normalize.outputs.REGISTRY == 'ghcr.io' && github.actor || secrets.REGISTRY_USERNAME }}
        password: ${{ steps.normalize.outputs.REGISTRY == 'ghcr.io' && github.token || secrets.REGISTRY_PASSWORD }}
        logout: true

    - name: Install Cosign
      if: ${{ inputs.SIGN }}
      uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

    - name: Sign image
      if: ${{ inputs.SIGN }}
      run: |
        cosign sign --yes "${{ steps.normalize.outputs.NORMALIZED_IMAGE }}@${{ inputs.DIGEST }}"

    - name: Generate SBOM with Trivy
      if: ${{ inputs.SBOM }}
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
      with:
        image-ref: ${{ steps.normalize.outputs.NORMALIZED_IMAGE }}@${{ inputs.DIGEST }}
        format: spdx-json
        output: sbom.spdx.json

    - name: Attest SBOM
      if: ${{ inputs.SBOM }}
      uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
      with:
        subject-name: ${{ steps.normalize.outputs.NORMALIZED_IMAGE }}
        subject-digest: ${{ inputs.DIGEST }}
        sbom-path: sbom.spdx.json
        push-to-registry: true
        # Avoids requiring the extra `artifact-metadata: write` permission on callers.
        create-storage-record: false

    - name: Write custom provenance predicate
      if: ${{ inputs.PROVENANCE && inputs.PROVENANCE_PREDICATE != '' }}
      env:
        PREDICATE_JSON: ${{ inputs.PROVENANCE_PREDICATE }}
      run: printf '%s' "$PREDICATE_JSON" > provenance-predicate.json

    - name: Attest build provenance
      if: ${{ inputs.PROVENANCE }}
      uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
      with:
        subject-name: ${{ steps.normalize.outputs.NORMALIZED_IMAGE }}
        subject-digest: ${{ inputs.DIGEST }}
        # Custom predicate takes over when both PROVENANCE_PREDICATE_TYPE and
        # PROVENANCE_PREDICATE are set, otherwise actions/attest auto-generates
        # standard SLSA build provenance (both inputs empty -> Provenance mode).
        predicate-type: ${{ inputs.PROVENANCE_PREDICATE != '' && inputs.PROVENANCE_PREDICATE_TYPE || '' }}
        predicate-path: ${{ inputs.PROVENANCE_PREDICATE != '' && 'provenance-predicate.json' || '' }}
        push-to-registry: true
        create-storage-record: false
