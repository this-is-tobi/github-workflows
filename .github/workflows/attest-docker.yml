name: Attest image

on:
  workflow_call:
    inputs:
      IMAGE_NAME:
        description: Full image name including registry and path (e.g. 'ghcr.io/my-org/my-image'). Normalized automatically (lowercase, underscores replaced by dashes).
        required: true
        type: string
      DIGEST:
        description: Digest of the image to attest (e.g. 'sha256:abc123...'). Use the 'digest' output of build-docker.yml.
        required: true
        type: string
      PROVENANCE:
        description: >-
          Generate GitHub's standard SLSA build provenance attestation for the
          image (records the calling workflow, repository and commit).
        required: false
        default: false
        type: boolean
      SBOM:
        description: Generate SBOM attestation for the image
        required: false
        default: false
        type: boolean
      SIGN:
        description: Sign the image digest with cosign keyless signing
        required: false
        default: false
        type: boolean
      PREDICATE_TYPE:
        description: >-
          URI identifying the type of a custom in-toto predicate to attach in
          addition to the standard attestations (e.g. to record upstream
          source/version for a mirrored image). Must be set together with
          PREDICATE. Use a URI you control, not the reserved SLSA provenance
          type 'https://slsa.dev/provenance/v1'.
        required: false
        type: string
      PREDICATE:
        description: >-
          JSON content for the custom in-toto predicate. Must be set together
          with PREDICATE_TYPE.
        required: false
        type: string
      RUNS_ON:
        description: Runner labels as JSON array (e.g., '["ubuntu-24.04"]' or '["self-hosted", "linux"]')
        required: false
        type: string
        default: '["ubuntu-24.04"]'
    secrets:
      REGISTRY_USERNAME:
        description: Username used to login into registry (not needed for ghcr.io)
        required: false
      REGISTRY_PASSWORD:
        description: Password used to login into registry (not needed for ghcr.io)
        required: false

jobs:
  attest:
    name: Attest image
    runs-on: ${{ fromJSON(inputs.RUNS_ON) }}
    permissions:
      packages: write
      id-token: write
      attestations: write
    steps:
    - name: Normalize image name
      id: normalize
      env:
        INPUT_IMAGE_NAME: ${{ inputs.IMAGE_NAME }}
      run: |
        NORMALIZED_IMAGE=$(echo "$INPUT_IMAGE_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/_/-/g')
        echo "NORMALIZED_IMAGE=$NORMALIZED_IMAGE" >> $GITHUB_OUTPUT
        echo "REGISTRY=$(echo "$INPUT_IMAGE_NAME" | cut -d "/" -f 1 | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Login to registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ steps.normalize.outputs.REGISTRY }}
        username: ${{ steps.normalize.outputs.REGISTRY == 'ghcr.io' && github.actor || secrets.REGISTRY_USERNAME }}
        password: ${{ steps.normalize.outputs.REGISTRY == 'ghcr.io' && github.token || secrets.REGISTRY_PASSWORD }}
        logout: true

    - name: Install Cosign
      if: ${{ inputs.SIGN }}
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Sign image
      if: ${{ inputs.SIGN }}
      run: |
        cosign sign --yes "${{ steps.normalize.outputs.NORMALIZED_IMAGE }}@${{ inputs.DIGEST }}"

    - name: Generate SBOM with Trivy
      if: ${{ inputs.SBOM }}
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ steps.normalize.outputs.NORMALIZED_IMAGE }}@${{ inputs.DIGEST }}
        format: spdx-json
        output: sbom.spdx.json

    - name: Check SBOM size
      id: sbom
      # actions/attest rejects an SBOM over 16 MiB. Checked here so an oversized
      # one is a named, explained condition rather than a raw error thrown from
      # inside the action - and, more importantly, so it does not take the
      # provenance attestation down with it as collateral.
      if: ${{ inputs.SBOM }}
      env:
        MAX_BYTES: 16777216
        IMAGE: ${{ steps.normalize.outputs.NORMALIZED_IMAGE }}
      run: |
        # `wc -c` pads its output on some platforms - strip it so the step output
        # is a bare integer rather than " 12345"
        SIZE=$(wc -c < sbom.spdx.json | tr -d "[:space:]")
        echo "size=${SIZE}" >> "$GITHUB_OUTPUT"
        if [ "${SIZE}" -gt "${MAX_BYTES}" ]; then
          echo "oversize=true" >> "$GITHUB_OUTPUT"
          echo "::warning::SBOM for ${IMAGE} is ${SIZE} bytes, over the ${MAX_BYTES} byte attestation limit - skipping the SBOM attestation."
          {
            echo ":warning: The SBOM for \`${IMAGE}\` is ${SIZE} bytes, over the ${MAX_BYTES} byte limit"
            echo "that \`actions/attest\` accepts, so no SBOM attestation was published. This usually"
            echo "means the image ships package-manager caches (npm's content store, Go module cache)"
            echo "that belong in the build, not in the image."
          } >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Attest SBOM
      if: ${{ inputs.SBOM && steps.sbom.outputs.oversize != 'true' }}
      uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
      with:
        subject-name: ${{ steps.normalize.outputs.NORMALIZED_IMAGE }}
        subject-digest: ${{ inputs.DIGEST }}
        sbom-path: sbom.spdx.json
        push-to-registry: true
        # Storage records (linked-artifacts metadata) are only supported for
        # organization-owned repos and would require `artifact-metadata: write`
        # on callers. The attestation itself is always persisted regardless.
        create-storage-record: false

    - name: Attest build provenance
      # Deliberately not gated on the SBOM steps succeeding. Provenance is the
      # attestation that establishes where and from what the image was built, so
      # an SBOM problem must never be the reason an image ships without it.
      if: ${{ !cancelled() && inputs.PROVENANCE }}
      uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
      with:
        subject-name: ${{ steps.normalize.outputs.NORMALIZED_IMAGE }}
        subject-digest: ${{ inputs.DIGEST }}
        push-to-registry: true
        # See "Attest SBOM" above for why storage records are disabled.
        create-storage-record: false

    - name: Validate custom predicate inputs
      # PREDICATE and PREDICATE_TYPE are only meaningful together; fail fast with
      # a clear message instead of letting actions/attest error out mid-run
      if: ${{ (inputs.PREDICATE != '') != (inputs.PREDICATE_TYPE != '') }}
      run: |
        echo "::error::PREDICATE and PREDICATE_TYPE must be set together (only one was provided)."
        exit 1

    - name: Write custom predicate
      if: ${{ inputs.PREDICATE != '' && inputs.PREDICATE_TYPE != '' }}
      env:
        PREDICATE_JSON: ${{ inputs.PREDICATE }}
      run: printf '%s' "$PREDICATE_JSON" > custom-predicate.json

    - name: Attest custom predicate
      if: ${{ inputs.PREDICATE != '' && inputs.PREDICATE_TYPE != '' }}
      uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
      with:
        subject-name: ${{ steps.normalize.outputs.NORMALIZED_IMAGE }}
        subject-digest: ${{ inputs.DIGEST }}
        predicate-type: ${{ inputs.PREDICATE_TYPE }}
        predicate-path: custom-predicate.json
        push-to-registry: true
        # See "Attest SBOM" above for why storage records are disabled.
        create-storage-record: false

    - name: Fail on skipped SBOM attestation
      # Last, so the signature, the provenance and any custom predicate are all
      # published first. An SBOM that was asked for and not delivered is still a
      # gap worth failing on - it just should not cost the image everything else.
      if: ${{ !cancelled() && steps.sbom.outputs.oversize == 'true' }}
      env:
        SIZE: ${{ steps.sbom.outputs.size }}
      run: |
        echo "::error::SBOM attestation skipped - the SBOM is ${SIZE} bytes, over the 16777216 byte limit."
        exit 1
