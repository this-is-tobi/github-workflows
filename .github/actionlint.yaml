---

# actionlint checks `runs-on` against a list of GitHub-hosted runner labels baked
# into the binary at build time, so any label GitHub ships after a release is
# reported as unknown even though the runner exists and works. 1.7.12 — the
# digest pinned in the `Lint workflows` step of ci.yml, and the newest release —
# was cut before the 2026-06-11 runner image preview, so it rejects
# `ubuntu-26.04`.
#
# `self-hosted-runner.labels` is the only knob actionlint offers here, and the
# unknown-label error points at it: it is an allowlist of extra labels, not a
# statement that they are self-hosted. Declaring them keeps the `runner-label`
# rule on, so a typo such as `ubunut-26.04` is still caught.
#
# Drop an entry once the pinned version knows the label natively, tracked
# upstream in https://github.com/rhysd/actionlint/issues/682.
self-hosted-runner:
  labels:
  - ubuntu-26.04
  - ubuntu-26.04-arm
